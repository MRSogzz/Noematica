# LLM WIKI — CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# 觸發條件：push 到 main 或 develop，或 Pull Request 合併
# 功能：
#   1. 型別校驗 (TypeScript)
#   2. I/O Schema 合規性檢查（確保所有模組 README.md 含合法 YAML + I/O Block）
#   3. 部署後 Latency 測量（writeback 到對應 Markdown）
#   4. 向量索引重建（DONE 文件有更新時）
#
# 【搬遷筆記】package.json 現在在 application/ 底下（不是 repo 根目錄），
# 所以每個 job 都加了 defaults.run.working-directory: application，
# 且 actions/setup-node 的 cache-dependency-path 要指到 application/package-lock.json，
# 否則 npm cache 會抓不到 lockfile。

name: LLM WIKI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: application

jobs:
  # ── Job 1: Lint & Type Check ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  # ── Job 2: Schema Validation ─────────────────────────────────────────────────
  schema-validate:
    name: I/O Schema Compliance
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Parse all module README.md files
        run: |
          echo "Scanning modules/ for YAML + I/O JSON compliance..."
          npm run parse -- --validate-only
        env:
          MODULES_DIR: ./modules
          DOCS_DIR:    ../knowledge/docs

      - name: Check for TypeMismatch in existing pipelines
        run: |
          echo "Running type compatibility checks..."
          npm run validate -- --all
        env:
          MODULES_DIR: ./modules

  # ── Job 3: CI Writeback (production only) ────────────────────────────────────
  ci-writeback:
    name: Latency Capture & Writeback
    runs-on: ubuntu-latest
    needs: schema-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write   # 這個 job 需要 git push 寫回結果，其他 job（typecheck/schema-validate/vector-rebuild）
                         # 都只是讀取，不用給——最小權限原則。這裡宣告的是「上限」，如果 repo 層級
                         # Settings → Actions → General → Workflow permissions 設的是唯讀，這裡宣告了也沒用，
                         # 那邊的設定才是真正的天花板，見下方 CI 錯誤說明。
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests & capture latency
        run: |
          echo "Measuring real I/O latency for changed modules..."
          npm run ci-writeback -- \
            --detect-changed \
            --base="${{ github.event.before }}" \
            --head="${{ github.sha }}" \
            --status=DONE \
            --commit-sha="${{ github.sha }}"
        env:
          MODULES_DIR:   ./modules
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GIT_REMOTE_URL: ${{ github.repositoryUrl }}

      - name: Commit writeback results
        working-directory: .
        run: |
          git config user.name  "LLM WIKI CI Bot"
          git config user.email "ci-bot@llm-wiki.dev"
          git add application/modules/ knowledge/docs/ knowledge/wiki/
          git diff --staged --quiet || git commit -m "[ci] writeback latency + status update (sha: ${{ github.sha }})"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 4: Rebuild vector index (on DONE doc changes) ───────────────────────
  vector-rebuild:
    name: Rebuild Vector Index
    runs-on: ubuntu-latest
    needs: ci-writeback
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild vector index
        run: npm run vector:build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODULES_DIR:    ./modules

      - name: Upload vector cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-cache
          path: application/.system/vector-cache.json
          retention-days: 7

  # ── Job 5: Rebuild epistemic index（Entities/Atoms/Observations 的 TSV 快照）─
  #
  # 跟其他 job 是完全不同的子系統：typecheck/schema-validate/ci-writeback/
  # vector-rebuild 都是 application/ 底下的 TS「llm-wiki 模組文件」系統，
  # 這個 job 管的是 epistemic/ 底下的 Python「知識卡片」系統（Entities/Atoms/
  # Observations），兩邊互不相依，所以不設 needs，讓它獨立跑、不用等 TS 那邊。
  #
  # 為什麼要有這個 job：查詢路徑（activation_engine.py / adapter.py /
  # correlation_engine.py）現在會優先讀 epistemic/.index/generated/*.tsv，
  # 只有在偵測到索引比來源檔案舊時才 fallback 回全量掃描。這個 job 讓索引
  # 自動跟著每次 push 到 main 重建，不用依賴每個開發者自己手動裝
  # pre-commit.sample / pre-commit.ps1 這個 hook。
  epistemic-index:
    name: Rebuild Epistemic Index
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .   # 覆蓋檔案最上面 workflow 層級的 application/ 預設——
                                # runtime/ 跟 epistemic/ 都在 repo 根目錄，不在 application/ 底下
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run runtime self-tests
        # 索引是「把知識庫攤平寫成 TSV」，如果核心引擎本身有問題，
        # 不該把用壞掉的邏輯產生的索引提交回去，先擋一次。
        run: |
          python3 runtime/policy/policy_engine.py
          python3 runtime/graph/graph_engine.py
          python3 runtime/policy/confidence_engine.py

      - name: Rebuild index
        run: python3 runtime/indexer/index_builder.py

      - name: Commit index if changed
        run: |
          git config user.name  "LLM WIKI CI Bot"
          git config user.email "ci-bot@llm-wiki.dev"
          git add epistemic/.index/generated/
          if git diff --staged --quiet; then
            echo "索引沒有變化，略過 commit。"
            exit 0
          fi
          git commit -m "[ci] rebuild epistemic index (sha: ${{ github.sha }})"
          # ci-writeback job 也會在同一次 workflow run 裡 push 到 main，兩個 job
          # 沒有 needs 相依、可能並行執行——先 rebase 到目前的 origin/main 再 push，
          # 避免其中一個因為對方先推上去而被拒絕（non-fast-forward）。
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}